# Quality gate for every push and pull request: formatting, lint, types, tests with coverage, dependency audit, build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests with coverage (Vitest)
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Coverage (lib/)", "| Metric | % | Covered |", "|---|---|---|", ...["lines","statements","functions","branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Fails on critical advisories. Known: a high-severity PostCSS advisory bundled inside Next.js 15 (build-time only,
      # fixed in Next 16 — tracked by Dependabot), so the gate is "critical" until that upgrade.
      - name: Dependency audit
        run: npm audit --audit-level=critical

      - name: Build (next build)
        run: npm run build
        env:
          # Placeholders: the build only needs the variables to exist; no request reaches these services.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
          EBAG_TOKEN_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          NEXT_TELEMETRY_DISABLED: "1"

  rls:
    name: Row Level Security (test Supabase project)
    # Runs against a separate test project, never production. Skipped when the RLS_* secrets are not set
    # (e.g. on forks), so the main check stays green without them.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Shared test database: let migration runs queue instead of overlapping.
    concurrency:
      group: rls-test-db
      cancel-in-progress: false
    env:
      RLS_SUPABASE_URL: ${{ secrets.RLS_SUPABASE_URL }}
      RLS_SUPABASE_ANON_KEY: ${{ secrets.RLS_SUPABASE_ANON_KEY }}
      RLS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RLS_SUPABASE_SERVICE_ROLE_KEY }}
      RLS_DB_URL: ${{ secrets.RLS_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.RLS_DB_URL != ''

      - uses: actions/setup-node@v4
        if: env.RLS_DB_URL != ''
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund
        if: env.RLS_DB_URL != ''

      # The test database always has exactly the schema in supabase/migrations.
      - name: Apply migrations to the test project
        if: env.RLS_DB_URL != ''
        run: npx supabase db push --db-url "$RLS_DB_URL" --yes

      - name: RLS tests
        if: env.RLS_DB_URL != ''
        run: npx vitest run test/rls

      - name: Skipped (no RLS_* secrets)
        if: env.RLS_DB_URL == ''
        run: echo "::notice::RLS tests skipped — set RLS_SUPABASE_URL, RLS_SUPABASE_ANON_KEY, RLS_SUPABASE_SERVICE_ROLE_KEY and RLS_DB_URL secrets to run them."

  e2e:
    name: End-to-end + accessibility (Playwright)
    # A production build in Chromium (Pixel 7) and WebKit (iPhone 15) against the same test project, after the RLS
    # job has brought its schema up to date. eBag is never contacted. Skipped without the RLS_* secrets.
    needs: rls
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: rls-test-db
      cancel-in-progress: false
    env:
      RLS_SUPABASE_URL: ${{ secrets.RLS_SUPABASE_URL }}
      RLS_SUPABASE_ANON_KEY: ${{ secrets.RLS_SUPABASE_ANON_KEY }}
      RLS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RLS_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.RLS_SUPABASE_URL != ''

      - uses: actions/setup-node@v4
        if: env.RLS_SUPABASE_URL != ''
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund
        if: env.RLS_SUPABASE_URL != ''

      - name: Reference data (recipes, products) into the test project
        if: env.RLS_SUPABASE_URL != ''
        run: node scripts/seed.ts
        env:
          SUPABASE_URL: ${{ secrets.RLS_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RLS_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install browsers
        if: env.RLS_SUPABASE_URL != ''
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        if: env.RLS_SUPABASE_URL != ''
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure() && env.RLS_SUPABASE_URL != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Skipped (no RLS_* secrets)
        if: env.RLS_SUPABASE_URL == ''
        run: echo "::notice::E2E tests skipped — set the RLS_* secrets (test Supabase project) to run them."
